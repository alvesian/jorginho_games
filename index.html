<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jorginho Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=IBM+Plex+Mono:wght@500;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: radial-gradient(115% 85% at 50% 18%, #f7f0e2 0%, #ded0b6 100%);
    font-family: 'Baloo 2', system-ui, sans-serif;
    color: #3a2a1c;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 56px 24px 64px; }
  header { text-align: center; margin-bottom: 40px; }
  .logo {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    background: #fbf4e6;
    border: 5px solid #3a2a1c;
    border-radius: 18px;
    padding: 34px 36px 30px;
    margin: 0;
  }
  .logo-name {
    font-family: 'Press Start 2P', monospace;
    font-size: 26px;
    line-height: 1;
    color: #3a2a1c;
    text-shadow: 5px 5px 0 #d8232a;
  }
  .logo-sub {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
  }
  .logo-sub .rule { flex: 1; height: 4px; background: #3a2a1c; }
  .logo-games {
    font-family: 'Press Start 2P', monospace;
    font-size: 15px;
    line-height: 1;
    color: #d8232a;
    letter-spacing: .08em;
  }
  .tagline {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #8a7358;
    margin-top: 16px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 22px;
  }
  .card {
    display: block;
    background: #fbf4e6;
    border: 3px solid #3a2a1c;
    border-radius: 20px;
    box-shadow: 0 6px 0 #3a2a1c;
    padding: 22px 22px 18px;
    text-decoration: none;
    color: inherit;
    transition: transform .1s ease;
  }
  .card:hover { transform: translateY(-3px); }
  .card:active { transform: translateY(3px); box-shadow: 0 2px 0 #3a2a1c; }
  .card .emoji { font-size: 40px; line-height: 1; }
  .card h2 { font-weight: 800; font-size: 22px; line-height: 1.15; margin: 12px 0 6px; }
  .card p { font-size: 15px; color: #7a6247; line-height: 1.45; margin: 0; }
  .card .play {
    display: inline-block;
    margin-top: 16px;
    background: #d8232a;
    color: #fbf4e6;
    border: 3px solid #3a2a1c;
    border-radius: 12px;
    box-shadow: 0 4px 0 #3a2a1c;
    padding: 7px 18px 5px;
    font-weight: 800;
    font-size: 16px;
  }
  .soon {
    border-style: dashed;
    box-shadow: none;
    background: rgba(251, 244, 230, .5);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 200px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #a08e78;
    text-align: center;
    padding: 22px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="logo" aria-label="Jorginho Games">
      <span class="logo-name">JORGINHO</span>
      <span class="logo-sub"><span class="rule"></span><span class="logo-games">GAMES</span><span class="rule"></span></span>
    </h1>
    <div class="tagline">uma coleção de mini-jogos · protótipos jogáveis</div>
  </header>
  <div class="grid" id="grid"></div>
</div>
<script>
  // Para adicionar um jogo novo: crie a pasta games/<slug>/ com um index.html
  // e acrescente uma entrada aqui.
  const GAMES = [
    {
      slug: 'jorginho-vai-ao-chiquinho',
      emoji: '🍦',
      title: 'Jorginho vai ao Chiquinho',
      desc: 'Atravesse as ruas cheias de trânsito e leve o Jorginho até a sorveteria do Chiquinho.'
    },
    {
      slug: 'jorginho-vai-ao-chiquinho-2',
      emoji: '🏋️',
      title: 'Jorginho vai ao Chiquinho 2',
      desc: 'A sorveteria virou academia. Atravesse as ruas e encare a série no Chiquinho Fit.'
    }
  ];

  const grid = document.getElementById('grid');
  GAMES.forEach((game) => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = `games/${game.slug}/`;
    a.innerHTML = `
      <div class="emoji">${game.emoji}</div>
      <h2>${game.title}</h2>
      <p>${game.desc}</p>
      <span class="play">Jogar</span>`;
    grid.appendChild(a);
  });

  const soon = document.createElement('div');
  soon.className = 'soon';
  soon.textContent = 'em breve · mais joguinhos';
  grid.appendChild(soon);
</script>
</body>
</html>
